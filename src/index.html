<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; media-src 'self' blob:; object-src 'none'; base-uri 'none'"><title>Jot</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="paper.css"><link rel="stylesheet" href="journal.css"><link rel="stylesheet" href="views.css"><link rel="stylesheet" href="calendar-colors.css"><link rel="stylesheet" href="chat-refine.css"><link rel="stylesheet" href="settings.css"><script src="../node_modules/markdown-it/dist/browser/markdown-it.umd.min.js"></script><script src="../node_modules/dompurify/dist/purify.min.js"></script></head>
<body><div class="app">
<div class="topbar"><button data-page="settings" id="settings-button" class="icon-button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24"><path d="m10 3-.6 2.2-1.6.9-2.2-.6-2 3.4 1.6 1.6v1.8L3.6 14l2 3.4 2.2-.6 1.6.9L10 20h4l.6-2.3 1.6-.9 2.2.6 2-3.4-1.6-1.7v-1.8l1.6-1.6-2-3.4-2.2.6-1.6-.9L14 3Z"/><circle cx="12" cy="11.5" r="3"/></svg></button><nav id="nav" aria-label="主要页面"><button data-page="today" class="active">Today</button><button data-page="todo">Todo <b id="todo-count" hidden>0</b></button><button data-page="ddl">DDL <b id="ddl-count" hidden>0</b></button></nav><div class="traffic-lights"><button id="hide" class="traffic red" aria-label="收起到桌面胶囊" title="收起到桌面胶囊"><span>×</span></button><button id="minimize" class="traffic yellow" aria-label="最小化" title="最小化"><span>−</span></button><button id="maximize" class="traffic green" aria-label="最大化或还原" title="最大化 / 还原"><span>+</span></button></div></div>
<main><header><div><div id="eyebrow" hidden></div><div id="today-date"></div><h1 id="page-title">今天</h1><p id="subtitle"></p></div><div class="header-actions"><button id="completion-count" class="completion-link" data-page="log"></button><button id="add-main" class="primary" aria-label="添加待办">＋</button></div></header><div id="view"></div></main>
<section class="chat" aria-label="对话与语音输入"><div class="chat-head"><span class="chat-name"><img src="../assets/jot-mark.svg" alt="">Jot</span><span class="chat-caption">修改可撤销</span><button id="chat-close" class="icon-button" aria-label="收起对话记录" title="收起对话记录">⌄</button></div><div id="messages" class="messages" aria-live="polite" hidden></div><div class="composer"><div id="voice-status" class="voice-status" role="status" hidden></div><textarea id="chat-input" rows="1" aria-label="消息内容" placeholder="记下待办，或聊一聊…"></textarea><div class="composer-actions"><button id="chat-toggle" class="icon-button history-toggle" aria-expanded="false" aria-controls="messages" aria-label="展开或收起对话记录" title="对话记录"><svg viewBox="0 0 24 24"><path d="M4 6h16v11H9l-5 3z"/><path d="M8 10h8m-8 3h5"/></svg></button><span id="model-label">Luna</span><button id="record" class="voice-button icon-button" aria-label="开始或停止录音" title="开始 / 停止录音"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></button><button id="cancel-chat" class="send-button" hidden aria-label="停止生成" title="停止生成">■</button><button id="send" class="send-button" aria-label="发送消息" title="发送消息"><svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></div></section>
</div><dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title">添加待办</h2><button type="button" id="edit-close" class="icon-button" aria-label="关闭编辑">×</button></div><input type="hidden" name="id"><input type="hidden" name="kind"><label>标题<input name="title" maxlength="300" required placeholder="一件具体的事"></label><div id="task-fields" class="form-grid"><label>状态<select name="status"><option value="open">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select></label><label id="priority-field">优先级<select name="priority"><option value="normal">普通</option><option value="high">优先</option><option value="low">稍后</option></select></label></div><label id="today-day-field">行动日期<input name="actionDay" type="date"></label><label id="today-link-field">关联长期 Todo（可选）<select name="todoId"><option value="">不关联</option></select></label><label id="planned-field" hidden>旧计划日期<input name="plannedDate" type="date"></label><label id="due-field">截止时间（可选）<input name="dueAt" type="datetime-local"></label><label id="completed-field">实际完成时间<input name="completedAt" type="datetime-local"></label><label id="completion-note-field">完成说明（可选）<textarea name="completionNote" rows="2" maxlength="10000" placeholder="这件事是怎么完成的？"></textarea></label><label>备注<textarea name="notes" rows="3" maxlength="10000" placeholder="可选"></textarea></label><div class="dialog-actions"><button type="button" id="edit-cancel">取消</button><button type="submit" class="primary">保存</button></div></form></dialog><div id="toast" class="toast" role="status" hidden></div><script src="renderer.js"></script><script src="views.js"></script><script src="settings.js"></script></body></html>
